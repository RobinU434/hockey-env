[project]
name = "hockey"
version = "2.6"
description = "Simple Hockey Environments"
authors = [
    {name = "Georg Martius, Uni Tuebingen, Autonomous Learning", email = "georg.martius@uni-tuebingen.de"}
]
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "gymnasium",
    "numpy",
    "box2d-py",
    "pygame",
]

[project.optional-dependencies]
pettingzoo = [
    "pettingzoo>=1.24.0",
]
rllib = [
    "ray[rllib]>=2.0.0",
]
all = [
    "pettingzoo>=1.24.0",
    "ray[rllib]>=2.0.0",
]
dev = [
    "uv>=0.9.18",
]
